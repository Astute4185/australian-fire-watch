name: Fire Watch private-source validation and candidate
permissions:
  code: read
  pull-requests: read
  issues: none
  actions: none
  releases: none
  packages: none
  wiki: none
  projects: none
env:
  PERSONAL_GITEA_SERVER: ${{ vars.PERSONAL_GITEA_SERVER }}
jobs:
  unit:
    runs-on: personal-ubuntu
    container:
      image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
    timeout-minutes: 30
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          pull_request:refs/pull/*/head)
            test "$GITHUB_BASE_REF" = main
            pr_number="${GITHUB_REF#refs/pull/}"; pr_number="${pr_number%/head}"
            case "$pr_number" in ''|*[!0-9]*) exit 1 ;; esac
            test "$pr_number" -gt 0 ;;
          push:refs/heads/main|schedule:refs/heads/main|workflow_dispatch:refs/heads/main) ;;
          workflow_dispatch:refs/heads/renovate/personal-*) ;;
          *) exit 1 ;;
        esac
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original Python unit, packaging and syntax gates
      shell: sh
      run: |
        set -eu
        python -m pip install --disable-pip-version-check pyyaml aiohttp 'ruff==0.17.1'
        python -m compileall -q custom_components tests
        python -m unittest discover -s tests -v
        python -m ruff check --select F821,F822,F823 custom_components tests tests_ha
        python .gitea/scripts/package_candidate.py --self-test
  runtime:
    needs:
    - unit
    runs-on: personal-ubuntu
    container:
      image: python:3.14-bookworm@sha256:7ee7e4d4fb42c3ad45b8fdc473b64ec69c3cf6e80ae5d52f6fa55f77fac29027
    timeout-minutes: 30
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          pull_request:refs/pull/*/head)
            test "$GITHUB_BASE_REF" = main
            pr_number="${GITHUB_REF#refs/pull/}"; pr_number="${pr_number%/head}"
            case "$pr_number" in ''|*[!0-9]*) exit 1 ;; esac
            test "$pr_number" -gt 0 ;;
          push:refs/heads/main|schedule:refs/heads/main|workflow_dispatch:refs/heads/main) ;;
          workflow_dispatch:refs/heads/renovate/personal-*) ;;
          *) exit 1 ;;
        esac
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original real Home Assistant runtime regressions
      shell: sh
      run: |
        set -eu
        python -m pip install --disable-pip-version-check -r requirements-test-ha.txt
        python -m pytest -q tests_ha --asyncio-mode=auto
  hassfest:
    needs:
    - runtime
    runs-on: personal-ubuntu
    container:
      image: ghcr.io/home-assistant/hassfest@sha256:2dce3c5423a600e7965e5a3d5a95e0707e8452fb001ab2b5d0602099bbecba92
    timeout-minutes: 20
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          pull_request:refs/pull/*/head)
            test "$GITHUB_BASE_REF" = main
            pr_number="${GITHUB_REF#refs/pull/}"; pr_number="${pr_number%/head}"
            case "$pr_number" in ''|*[!0-9]*) exit 1 ;; esac
            test "$pr_number" -gt 0 ;;
          push:refs/heads/main|schedule:refs/heads/main|workflow_dispatch:refs/heads/main) ;;
          workflow_dispatch:refs/heads/renovate/personal-*) ;;
          *) exit 1 ;;
        esac
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Official hassfest inside the job container
      shell: sh
      run: |
        set -eu
        test -f /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh
        # This entrypoint discovers custom_components relative to the checkout,
        # then changes to its installed core tree before invoking hassfest.
        /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh
  candidate:
    needs:
    - unit
    - runtime
    - hassfest
    runs-on: personal-ubuntu
    container:
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    timeout-minutes: 15
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          pull_request:refs/pull/*/head)
            test "$GITHUB_BASE_REF" = main
            pr_number="${GITHUB_REF#refs/pull/}"; pr_number="${pr_number%/head}"
            case "$pr_number" in ''|*[!0-9]*) exit 1 ;; esac
            test "$pr_number" -gt 0 ;;
          push:refs/heads/main|schedule:refs/heads/main|workflow_dispatch:refs/heads/main) ;;
          workflow_dispatch:refs/heads/renovate/personal-*) ;;
          *) exit 1 ;;
        esac
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original JavaScript regressions and immutable POSIX candidate
      shell: sh
      env:
        GATE_UNIT: ${{ needs.unit.result }}
        GATE_RUNTIME: ${{ needs.runtime.result }}
        GATE_HASSFEST: ${{ needs.hassfest.result }}
      run: |
        set -eu
        test "$GATE_UNIT" = success
        test "$GATE_RUNTIME" = success
        test "$GATE_HASSFEST" = success
        node --check custom_components/australian_fire_watch/frontend/australian-fire-watch-panel.js
        node --test tests/frontend-recovery.test.cjs
        python3 .gitea/scripts/package_candidate.py
    - name: Retain the candidate on private Gitea
      uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
      with:
        name: firewatch-candidate-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 14
  dependency_status:
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/renovate/personal-'))
      || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/personal-') &&
      github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs:
    - unit
    - runtime
    - hassfest
    - candidate
    runs-on: personal-ubuntu
    timeout-minutes: 5
    permissions:
      code: write
      pull-requests: read
      issues: none
      actions: none
      releases: none
      packages: none
      wiki: none
      projects: none
    steps:
    - name: Report only the exact dependency proposal validation result
      env:
        STATUS_JOB_TOKEN: ${{ secrets.GITEA_TOKEN }}
        GATE_UNIT: ${{ needs.unit.result }}
        GATE_RUNTIME: ${{ needs.runtime.result }}
        GATE_HASSFEST: ${{ needs.hassfest.result }}
        GATE_CANDIDATE: ${{ needs.candidate.result }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        # PERSONAL_DEPENDENCY_STATUS_V2
        import json,os,re,urllib.request
        server=os.environ['PERSONAL_GITEA_SERVER'];repo='hallyaus/australian-fire-watch'
        assert os.environ['GITHUB_SERVER_URL']==server and os.environ['GITHUB_REPOSITORY']==repo
        source=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',source)
        assert os.environ['GITHUB_EVENT_NAME']in('workflow_dispatch','pull_request')
        ref=os.environ['GITHUB_REF'];assert ref.startswith('refs/heads/renovate/personal-')or(ref.startswith('refs/pull/')and ref.endswith('/head'))
        results=[os.environ['GATE_'+name.upper()]for name in ['unit','runtime','hassfest','candidate']]
        assert all(x in('success','failure','cancelled','skipped')for x in results)
        state='success'if results==['success']*4else('error'if'cancelled'in results else'failure')
        token=os.environ.pop('STATUS_JOB_TOKEN');assert token
        class NoRedirect(urllib.request.HTTPRedirectHandler):
         def redirect_request(self,*args,**kwargs):raise RuntimeError('Unexpected authenticated redirect')
        opener=urllib.request.build_opener(NoRedirect)
        def api(path,body=None):
         request=urllib.request.Request(server+'/api/v1/repos/'+repo+path,method='GET'if body is None else'POST',data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'token '+token,'Content-Type':'application/json'})
         with opener.open(request,timeout=30)as response:
          raw=response.read(2097153);assert len(raw)<=2097152
          return json.loads(raw)if raw else None
        metadata=api('');assert metadata['private']and metadata['owner']['login']=='hallyaus'
        branch=api('/branches/main');assert branch['protected']and not branch['user_can_push']and not branch['user_can_merge']
        pulls=api('/pulls?state=open&limit=100');matches=[p for p in pulls if p['head']['sha']==source and p['head']['ref'].startswith('renovate/personal-')and p['base']['ref']=='main'and p['head']['repo']['id']==metadata['id']]
        assert len(matches)<=1
        if matches:
         status=api('/statuses/'+source,{'state':state,'context':'personal-dependency-checks','description':'Exact-source unit, real HA, hassfest and package gates: '+state,'target_url':matches[0]['html_url']})
         assert status['status']==state and status['context']=='personal-dependency-checks'
        print(json.dumps({'personal_dependency_validation_status':{'source':source,'state':state,'test_results':results,'matching_open_proposals':len(matches),'published':bool(matches),'default_push_and_merge_denied':True,'credential_values_recorded':False}}))
        token=None
        PY
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
  schedule:
  - cron: 17 3 * * 6
  pull_request:
    branches:
    - main
