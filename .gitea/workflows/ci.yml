name: Fire Watch private-source validation and candidate
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
  schedule:
    - cron: '17 3 * * 6'
permissions:
  contents: read
env:
  PERSONAL_GITEA_SERVER: ${{ vars.PERSONAL_GITEA_SERVER }}
jobs:
  unit:
    runs-on: personal-ubuntu
    container:
      image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
    timeout-minutes: 30
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        test "$GITHUB_REF" = 'refs/heads/main'
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original Python unit, packaging and syntax gates
      shell: sh
      run: |
        set -eu
        python -m pip install --disable-pip-version-check pyyaml aiohttp 'ruff==0.17.1'
        python -m compileall -q custom_components tests
        python -m unittest discover -s tests -v
        python -m ruff check --select F821,F822,F823 custom_components tests tests_ha
        python .gitea/scripts/package_candidate.py --self-test
  runtime:
    needs:
    - unit
    runs-on: personal-ubuntu
    container:
      image: python:3.14-bookworm@sha256:7ee7e4d4fb42c3ad45b8fdc473b64ec69c3cf6e80ae5d52f6fa55f77fac29027
    timeout-minutes: 30
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        test "$GITHUB_REF" = 'refs/heads/main'
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original real Home Assistant runtime regressions
      shell: sh
      run: |
        set -eu
        python -m pip install --disable-pip-version-check -r requirements-test-ha.txt
        python -m pytest -q tests_ha --asyncio-mode=auto
  hassfest:
    needs:
    - runtime
    runs-on: personal-ubuntu
    container:
      image: ghcr.io/home-assistant/hassfest@sha256:2dce3c5423a600e7965e5a3d5a95e0707e8452fb001ab2b5d0602099bbecba92
    timeout-minutes: 20
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        test "$GITHUB_REF" = 'refs/heads/main'
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Official hassfest inside the job container
      shell: sh
      run: |
        set -eu
        test -f /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh
        # This entrypoint discovers custom_components relative to the checkout,
        # then changes to its installed core tree before invoking hassfest.
        /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh
  candidate:
    needs:
    - unit
    - runtime
    - hassfest
    runs-on: personal-ubuntu
    container:
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    timeout-minutes: 15
    steps:
    - name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test -n "${PERSONAL_GITEA_SERVER:?Repository primary URL variable required}"
        test "$GITHUB_SERVER_URL" = "$PERSONAL_GITEA_SERVER"
        test "$GITHUB_REPOSITORY" = 'hallyaus/australian-fire-watch'
        test "$GITHUB_REF" = 'refs/heads/main'
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/firewatch-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original JavaScript regressions and immutable POSIX candidate
      shell: sh
      env:
        GATE_UNIT: ${{ needs.unit.result }}
        GATE_RUNTIME: ${{ needs.runtime.result }}
        GATE_HASSFEST: ${{ needs.hassfest.result }}
      run: |
        set -eu
        test "$GATE_UNIT" = success
        test "$GATE_RUNTIME" = success
        test "$GATE_HASSFEST" = success
        node --check custom_components/australian_fire_watch/frontend/australian-fire-watch-panel.js
        node --test tests/frontend-recovery.test.cjs
        python3 .gitea/scripts/package_candidate.py
    - name: Retain the candidate on private Gitea
      uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
      with:
        name: firewatch-candidate-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 14
