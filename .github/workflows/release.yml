name: Publish HACS release

# Create a version tag only after merging a tested change to the default branch.
# Example: git tag v1.4.2 && git push origin v1.4.2
# Never publish a GitHub release manually ahead of this workflow: the ZIP must
# be attached at release creation time for HACS zip_release installs to work.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: hacs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: Publish tagged integration ZIP
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Refuse tags that are not on the default branch
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit already on main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Build and verify the HACS release ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_hacs_release.py \
            --ref "$GITHUB_SHA" \
            --expected-tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/australian_fire_watch.zip"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; no asset will be overwritten."
            exit 1
          fi

      - name: Publish the release and ZIP together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/australian_fire_watch.zip" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Record published asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## HACS release published"
            echo
            printf -- "- Tag: %s\n" "$RELEASE_TAG"
            echo "- Asset: australian_fire_watch.zip"
            printf -- "- Source: %s\n" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
